name: Validate & lint skills
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default: no job in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  NODE_VERSION: "24"

jobs:
  gates:
    name: Skill quality gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Structure, frontmatter and mirror sync
        run: python3 scripts/validate-skills.py --check-sync --strict

      - name: Routing and content-coverage evals
        run: python3 scripts/run-evals.py --min-pass-rate 95 --out benchmark.json

      - name: 8-point compliance gate
        run: python3 scripts/compliance-check.py --out compliance.json

      - name: Generated runtime targets are up to date
        run: python3 scripts/sync-all.py --check

      - name: Generated documentation is up to date
        run: python3 scripts/generate-docs.py --check

      - name: Bundled scripts compile
        run: |
          python3 -m compileall -q scripts
          find skills -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Upload gate reports
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-gate-reports
          path: |
            benchmark.json
            compliance.json
          retention-days: 14
          if-no-files-found: warn

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find scripts -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning

  lint:
    name: Markdown, JSON/YAML and Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Markdown, JSON/YAML and Python lint
        run: make lint
